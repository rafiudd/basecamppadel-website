<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" fill="none">
  <defs>
    <!-- Gradients for Male Athletic Silhouette -->
    <linearGradient id="bodyMenGrad" x1="200" y1="120" x2="200" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF7F1" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FBF7F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0.10" />
    </linearGradient>
    <linearGradient id="racketMenGrad" x1="250" y1="120" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFD43B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="highlightMen" x1="120" y1="140" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFD43B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowMen" x1="200" y1="180" x2="200" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1B1650" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Sporty Aura -->
  <ellipse cx="200" cy="320" rx="140" ry="180" fill="url(#glowMen)" />

  <!-- Dynamic Court Accent Grid lines in background -->
  <g stroke="#FBF7F1" stroke-width="1.2" stroke-opacity="0.08" stroke-dasharray="4 6">
    <line x1="60" y1="200" x2="340" y2="200" />
    <line x1="40" y1="320" x2="360" y2="320" />
    <line x1="30" y1="440" x2="370" y2="440" />
    <line x1="140" y1="120" x2="140" y2="520" />
    <line x1="260" y1="120" x2="260" y2="520" />
  </g>

  <!-- Athletic Player Silhouette Group -->
  <g>
    <!-- Left Arm & Shoulder in Ready Stance -->
    <path d="M125 240 C95 270 70 320 68 370 C66 390 85 395 96 380 C108 360 128 320 142 285 Z" fill="url(#bodyMenGrad)" />

    <!-- Torso / Athletic Athletic Polo & Chest -->
    <path d="M130 220 C110 260 95 360 85 540 L315 540 C305 380 290 270 270 220 C250 200 225 195 200 195 C175 195 150 200 130 220 Z" fill="url(#bodyMenGrad)" />

    <!-- Athletic Chest Contour Lines -->
    <path d="M130 220 C155 245 200 250 200 290" stroke="#FFD43B" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round" fill="none" />
    <path d="M270 220 C245 245 200 250 200 290" stroke="#FBF7F1" stroke-width="1.5" stroke-opacity="0.25" stroke-linecap="round" fill="none" />
    <path d="M200 290 L200 420" stroke="#FBF7F1" stroke-width="1.5" stroke-opacity="0.18" stroke-linecap="round" stroke-dasharray="4 4" />

    <!-- Collar / Neck -->
    <path d="M178 175 L172 215 C185 224 215 224 228 215 L222 175 Z" fill="#FBF7F1" fill-opacity="0.32" />
    <path d="M172 215 L200 240 L228 215" stroke="#FFD43B" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Head / Athletic Cap Profile -->
    <path d="M165 145 C165 105 180 82 200 82 C220 82 235 105 235 145 C235 170 220 180 200 180 C180 180 165 170 165 145 Z" fill="#FBF7F1" fill-opacity="0.36" />
    <!-- Backward Sporty Cap -->
    <path d="M165 130 C165 98 178 84 200 84 C222 84 235 98 235 130 C220 125 180 125 165 130 Z" fill="#FFD43B" fill-opacity="0.5" />
    <path d="M156 128 C160 123 166 126 168 132 C164 135 158 134 156 128 Z" fill="#FFD43B" fill-opacity="0.8" />

    <!-- Right Arm Holding Racket (Forward angled) -->
    <path d="M265 230 C290 260 310 290 316 335 C318 350 302 360 292 352 C280 342 265 315 250 280 Z" fill="url(#bodyMenGrad)" />
    <!-- Forearm leading to racket handle -->
    <path d="M312 338 L326 310 C332 312 336 322 332 330 L320 352 Z" fill="#FBF7F1" fill-opacity="0.4" />
  </g>

  <!-- Padel Racket in Hand -->
  <g transform="translate(4, -10)">
    <!-- Racket Handle & Grip Wrap -->
    <rect x="325" y="278" width="13" height="42" rx="3" transform="rotate(-28 325 278)" fill="#FBF7F1" fill-opacity="0.75" />
    <line x1="324" y1="288" x2="336" y2="294" stroke="#17151F" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-28 325 278)" />
    <line x1="324" y1="298" x2="336" y2="304" stroke="#17151F" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-28 325 278)" />
    <line x1="324" y1="308" x2="336" y2="314" stroke="#17151F" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-28 325 278)" />

    <!-- Safety Wrist Cord (Padel signature cordón) -->
    <path d="M338 318 Q346 340 334 355 Q326 350 324 340" stroke="#FFD43B" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2" fill="none" />

    <!-- Racket Throat (Triangular Bridge) -->
    <path d="M328 265 L314 225 L346 214 L342 258 Z" fill="#FF5A3C" fill-opacity="0.8" />
    <polygon points="325,242 333,228 338,240" fill="#1B1650" fill-opacity="0.7" />

    <!-- Padel Racket Head (Perforated Solid Frame) -->
    <ellipse cx="328" cy="168" rx="46" ry="58" transform="rotate(-24 328 168)" fill="url(#racketMenGrad)" stroke="#FFD43B" stroke-width="4" stroke-opacity="0.95" />

    <!-- Padel Holes Grid (Perforations) -->
    <g fill="#1B1650" fill-opacity="0.85" transform="rotate(-24 328 168)">
      <circle cx="328" cy="138" r="4.2" />
      <circle cx="314" cy="152" r="4.2" />
      <circle cx="328" cy="152" r="4.2" />
      <circle cx="342" cy="152" r="4.2" />
      <circle cx="304" cy="168" r="4.2" />
      <circle cx="320" cy="168" r="4.2" />
      <circle cx="336" cy="168" r="4.2" />
      <circle cx="352" cy="168" r="4.2" />
      <circle cx="314" cy="184" r="4.2" />
      <circle cx="328" cy="184" r="4.2" />
      <circle cx="342" cy="184" r="4.2" />
      <circle cx="328" cy="198" r="4.2" />
    </g>
  </g>

  <!-- Subtle Dynamic Energy Arc (Speed line) -->
  <path d="M70 480 C120 505 280 505 340 460" stroke="#FFD43B" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" fill="none" />
</svg>
